server {
  listen 8080;
  server_name _;
  location = /health { access_log off; return 200 "ok"; }
  location / { return 404; }
  location ~ ^/reports/(?<run>[0-9a-f-]{36})/docs$ {
    absolute_redirect off;
    return 308 /reports/$run/docs/;
  }
  location ~ ^/reports/(?<run>[0-9a-f-]{36})/docs/(?<asset>.*)$ {
    alias /data/runs/$run/docs/$asset;
    index index.html;
    disable_symlinks on;
    add_header X-Content-Type-Options nosniff always;
  }
}
