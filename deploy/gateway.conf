map $http_upgrade $connection_upgrade { default upgrade; "" close; }
server {
  listen 8080;
  server_name _;
  # Samakan dengan batas atas max_upload_mb; backend tetap memvalidasi ukuran.
  client_max_body_size 1024m;
  add_header X-Content-Type-Options nosniff always;
  # Web listen di 3100 (Dockerfile), bukan 3000.
  location / { proxy_pass http://web:3100; proxy_set_header Host $http_host; }
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $http_host;
    # Generator spec menahan respons sampai crawl selesai (±60 dtk).
    proxy_read_timeout 120s;
  }
  # Report dan artifact dilayani backend, bukan rewrite build-time di container web.
  location /artifacts/ { proxy_pass http://backend:3001; proxy_set_header Host $http_host; }
  location /ws {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }
}
