map $http_upgrade $connection_upgrade { default upgrade; "" close; }
server {
  listen 8080;
  server_name _;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;
  location / { proxy_pass http://web:3000; proxy_set_header Host $http_host; }
  location /api/ { proxy_pass http://backend:3001; proxy_set_header Host $http_host; }
  location /ws {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }
  location = /_report_auth {
    internal;
    proxy_pass http://backend:3001/api/auth/require;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
  }
  location /reports/ {
    auth_request /_report_auth;
    proxy_pass http://docs:8080;
    add_header Cache-Control "private, no-store" always;
    add_header Content-Security-Policy "sandbox allow-scripts allow-downloads; frame-ancestors 'self'" always;
  }
}
