services:
  backend:
    build:
      context: .
      target: runner
    init: true
    environment:
      DATABASE_URL: sqlite:/data/qa.db
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      TARGET_ALLOWLIST: ${TARGET_ALLOWLIST:?Set TARGET_ALLOWLIST}
      RUNS_DIR: /data/runs
      HOST: 0.0.0.0
      PORT: 3001
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - database-data:/data
      - run-data:/data/runs
    shm_size: 1gb
    restart: unless-stopped
    stop_grace_period: 30s
  web:
    build:
      context: .
      target: web
    environment:
      API_INTERNAL_URL: http://backend:3001
    restart: unless-stopped
  docs:
    build:
      context: .
      target: docs
    volumes:
      - run-data:/data/runs:ro
    restart: unless-stopped
  gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./deploy/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web, backend, docs]
    restart: unless-stopped
volumes:
  database-data:
  run-data:
