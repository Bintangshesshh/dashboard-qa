services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qa_dashboard
      POSTGRES_USER: qa_dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_dashboard -d qa_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  backend:
    build:
      context: .
      target: runner
    init: true
    environment:
      DATABASE_URL: postgresql://qa_dashboard:${POSTGRES_PASSWORD}@postgres:5432/qa_dashboard
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?Set OPERATOR_TOKEN}
      TARGET_ALLOWLIST: ${TARGET_ALLOWLIST:?Set TARGET_ALLOWLIST}
      RUNS_DIR: /data/runs
      HOST: 0.0.0.0
      PORT: 3001
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - run-data:/data/runs
    shm_size: 1gb
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
  web:
    build:
      context: .
      target: web
    environment:
      API_INTERNAL_URL: http://backend:3001
    restart: unless-stopped
  docs:
    build:
      context: .
      target: docs
    volumes:
      - run-data:/data/runs:ro
    restart: unless-stopped
  gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./deploy/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web, backend, docs]
    restart: unless-stopped
volumes:
  postgres-data:
  run-data:
